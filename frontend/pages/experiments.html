<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hypothesis Tracking — GrowTube</title>
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/layout.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/pages.css">
  <link rel="stylesheet" href="/css/responsive.css">
</head>
<body>

  <div class="app-shell">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-brand">
        <div class="brand-icon">
          <svg viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
        </div>
        <span>GrowTube</span>
      </div>

      <nav class="sidebar-nav">
        <a href="/dashboard" class="nav-item">
          <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg>
          Home
        </a>
        <a href="/niche-radar" class="nav-item">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><circle cx="12" cy="12" r="6"></circle><circle cx="12" cy="12" r="2"></circle><line x1="12" y1="2" x2="12" y2="4"></line><line x1="12" y1="20" x2="12" y2="22"></line><line x1="20" y1="12" x2="22" y2="12"></line><line x1="2" y1="12" x2="4" y2="12"></line></svg>
          Niche Radar
        </a>
        <a href="/creator-struggles" class="nav-item">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
          Creator Struggles
        </a>
        <a href="/ask-ai" class="nav-item">
          <svg viewBox="0 0 24 24"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path></svg>
          Ask AI
        </a>
      </nav>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
      <div class="page-container" style="max-width: 1080px;">

        <div style="margin-bottom: 28px;">
          <h2 style="font-size: 2rem; color: #F0F2F5;">Hypotheses & Outcome Learning</h2>
          <p style="color: #9BA3AB;">Track pre-publish predictions against real post-upload retention and CTR metrics.</p>
        </div>

        <div style="display: grid; grid-template-columns: 1.3fr 1fr; gap: 28px;">
          <!-- Left: Existing Experiments List -->
          <div>
            <h3 style="font-size: 1.15rem; color: #F0F2F5; margin-bottom: 16px;">Active & Completed Hypotheses</h3>
            <div id="experiments-list-container">
              <div style="color: #6E7681; font-size: 0.88rem; padding: 20px;">Loading hypotheses...</div>
            </div>
          </div>

          <!-- Right: Register New Hypothesis Form -->
          <div class="card" style="height: fit-content;">
            <h3 style="font-size: 1.15rem; color: #F0F2F5; margin-bottom: 16px;">Register New Hypothesis</h3>
            <form id="new-experiment-form">
              <div style="margin-bottom: 16px;">
                <label style="display: block; font-size: 0.82rem; color: #8E959B; margin-bottom: 6px;">Hypothesis Statement</label>
                <textarea id="exp-hypothesis-input" class="input-field" style="height: 90px;" placeholder="e.g. Using a 10s cold open without bumper will raise 30s retention to >= 55%" required></textarea>
              </div>

              <div style="margin-bottom: 16px;">
                <label style="display: block; font-size: 0.82rem; color: #8E959B; margin-bottom: 6px;">Target Metric</label>
                <input type="text" id="exp-metric-input" class="input-field" placeholder="e.g. 30s Retention, Impression CTR, AVD" required>
              </div>

              <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 24px;">
                <div>
                  <label style="display: block; font-size: 0.82rem; color: #8E959B; margin-bottom: 6px;">Baseline (%)</label>
                  <input type="number" step="0.1" id="exp-baseline-input" class="input-field" placeholder="47.0" required>
                </div>
                <div>
                  <label style="display: block; font-size: 0.82rem; color: #8E959B; margin-bottom: 6px;">Expected (%)</label>
                  <input type="number" step="0.1" id="exp-expected-input" class="input-field" placeholder="58.0" required>
                </div>
              </div>

              <button type="submit" class="btn btn-lime" style="width: 100%;">Register Hypothesis →</button>
            </form>
          </div>
        </div>

      </div>
    </main>
  </div>

  <script type="module" src="/js/experiments.js"></script>
  <script type="module" src="/js/navigation.js"></script>
</body>
</html>
