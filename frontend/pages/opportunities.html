<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Content Opportunities — GrowTube</title>
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/layout.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/pages.css">
  <link rel="stylesheet" href="/css/responsive.css">
</head>
<body>

  <div class="app-shell">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-brand">
        <div class="brand-icon">
          <svg viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
        </div>
        <span>GrowTube</span>
      </div>

      <nav class="sidebar-nav">
        <a href="/dashboard" class="nav-item">
          <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg>
          Home
        </a>
        <a href="/niche-radar" class="nav-item">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><circle cx="12" cy="12" r="6"></circle><circle cx="12" cy="12" r="2"></circle><line x1="12" y1="2" x2="12" y2="4"></line><line x1="12" y1="20" x2="12" y2="22"></line><line x1="20" y1="12" x2="22" y2="12"></line><line x1="2" y1="12" x2="4" y2="12"></line></svg>
          Niche Radar
        </a>
        <a href="/creator-struggles" class="nav-item">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
          Creator Struggles
        </a>
        <a href="/ask-ai" class="nav-item">
          <svg viewBox="0 0 24 24"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path></svg>
          Ask AI
        </a>
      </nav>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
      <div class="page-container">

        <!-- Page Header matching Screen 5 -->
        <div style="margin-bottom: 28px;">
          <h2 style="font-size: 2rem; color: #F0F2F5;">Content Opportunities</h2>
          <p style="color: #9BA3AB;">AI-powered ideas based on your data, audience questions, and market research.</p>
        </div>

        <!-- Filter bar -->
        <div class="filter-bar">
          <div class="filter-pills">
            <button class="filter-btn active" data-filter="all">All</button>
            <button class="filter-btn" data-filter="Tutorials">Tutorials</button>
            <button class="filter-btn" data-filter="Reviews">Reviews</button>
            <button class="filter-btn" data-filter="News">News</button>
            <button class="filter-btn" data-filter="Opinion">Opinion</button>
            <button class="filter-btn" data-filter="Tools">Tools</button>
            <button class="filter-btn" data-filter="high-potential">⚡ High Potential</button>
          </div>

          <div class="topbar-search" style="width: 260px;">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
            <input type="text" id="search-opportunities-input" placeholder="Search ideas...">
          </div>
        </div>

        <!-- Opportunities List -->
        <div id="opportunities-container" class="opportunity-card-list">
          <!-- Rendered via js/opportunities.js -->
        </div>

      </div>
    </main>
  </div>

  <script type="module" src="/js/opportunities.js"></script>
  <script type="module" src="/js/navigation.js"></script>
</body>
</html>
